name: Lint & Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install linting deps
        run: pip install ruff pyflakes

      - name: Ruff lint
        run: ruff check . --ignore E501,S307,S603

      - name: Syntax check all Python files
        run: |
          find . -name "*.py" | while read f; do
            python -m py_compile "$f" && echo "OK: $f"
          done